name: Test on push or pull_request

on: [ push, pull_request ]

env:
  APP_NAME: nextdiary

jobs:
  unit_test:
    environment: development
    runs-on: ubuntu-latest
    name: "Tests: PHP ${{ matrix.php-versions }} / Nextcloud ${{ matrix.nextcloud }}"
    strategy:
      fail-fast: false
      matrix:
        # appinfo/info.xml declares PHP 8.1-8.5 and Nextcloud 30-35. Every combination below is
        # supported by that server branch (see lib/versioncheck.php of the branch); together they
        # cover both edges of both ranges and every PHP minor version in between.
        # The app is enabled WITHOUT --force, so a too narrow info.xml range fails the job.
        include:
          - php-versions: '8.1'   # minimum PHP, minimum Nextcloud
            nextcloud: 'stable30'
          - php-versions: '8.3'
            nextcloud: 'stable30'
          - php-versions: '8.3'
            nextcloud: 'stable31'
          - php-versions: '8.4'
            nextcloud: 'stable32'
          - php-versions: '8.2'
            nextcloud: 'stable33'
          - php-versions: '8.4'   # issue #6: Nextcloud 33 + PHP 8.4
            nextcloud: 'stable33'
          - php-versions: '8.5'
            nextcloud: 'stable34'
          - php-versions: '8.5'   # maximum PHP, maximum Nextcloud
            nextcloud: 'stable35'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: pdo_sqlite,pdo_mysql,pdo_pgsql,gd,zip
          coverage: none

      - name: Set up server with sqlite
        # SMillerDev/nextcloud-actions release 2026.09.21.1 (node24 runtime)
        uses: SMillerDev/nextcloud-actions/setup-nextcloud@ae95709955d06dea39756101e07ec5b6134f14d7
        with:
          cron: false
          version: ${{ matrix.nextcloud }}
          database-type: sqlite

      - name: Configure server with app
        uses: SMillerDev/nextcloud-actions/setup-nextcloud-app@ae95709955d06dea39756101e07ec5b6134f14d7
        with:
          app: ${{ env.APP_NAME }}
          check-code: false

      - name: Run composer with dev env
        run: |
          cd ../server/apps/${{ env.APP_NAME }} && composer install --no-interaction

      - name: Run unit tests
        run: |
          cd ../server/apps/${{ env.APP_NAME }} && vendor/bin/phpunit --testsuite unit

      - name: Run integration tests
        run: |
          cd ../server/apps/${{ env.APP_NAME }} && vendor/bin/phpunit --testsuite integration

  frontend_build:
    runs-on: ubuntu-latest
    name: "Frontend: release build matches committed bundles"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Same steps as `make npm` in the release workflow
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Compare with committed bundles
        run: git diff --stat --exit-code -- js/nextdiary-main.js js/nextdiary-settings.js js/nextdiary-main.js.LICENSE.txt js/nextdiary-settings.js.LICENSE.txt
